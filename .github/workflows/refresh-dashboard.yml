name: Refresh AI compute dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      force_gpufinder:
        description: "忽略 GPU Finder 周更到期检查，立即采集一次（用于验证新 API key）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-ai-compute-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - run: pip install -r requirements-deploy.txt
      - name: Refresh source data and build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_USER_AGENT: "AI-Compute-Economics-Tracker/1.0 contact: ${{ github.repository_owner }}@users.noreply.github.com"
          # GPU Finder 2026-10-09 起需 Bearer key；未配置时为空 → 采集脚本按匿名请求处理并如实降级
          GPUFINDER_API_KEY: ${{ secrets.GPUFINDER_API_KEY }}
          # workflow_dispatch 勾选 force_gpufinder 时忽略周更到期检查（仅用于验证 key）
          GPUFINDER_FORCE: ${{ inputs.force_gpufinder }}
        run: python scripts/refresh_and_build.py
      - name: Validate deploy freshness
        run: python scripts/validate_deploy_refresh.py
      - name: Browser smoke test (runtime JS gate)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py
      - name: Validate dashboard (full test suite)
        # 必须跑全量：此前只跑 test_time_series_dashboard.py（7 条），
        # 导致 P0/P1–P4 的 26 条回归测试根本没在守门——2026-09-28 的定时任务
        # 就是在唯一被跑的测试文件里踩到过期假设而挂掉的。
        run: python -m pytest test_suite/ -q
      - name: Commit refreshed artifacts
        run: |
          git config user.name "Angus"
          git config user.email "281128372+angusggsimid@users.noreply.github.com"
          git add public/index.html html_dashboard/ai_compute_economics_monitor.html html_dashboard/v4/time_series_snapshot.json tracker_data/backfills tracker_data/thesis_states tracker_data/deploy_refresh_status.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh dashboard"
          # 手动推送（修 bug 等）与定时任务会竞争：直接 push 会因 non-fast-forward 失败。
          # 先 rebase 再推；产物文件冲突时以【本次构建】为准（它就是最新数据）。
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -q; then
              :
            else
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --theirs "$f" 2>/dev/null && git add "$f"
              done
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            git push && exit 0
            echo "push 失败（第 $attempt 次），重试…"
            sleep 10
          done
          echo "三次推送均失败" && exit 1
