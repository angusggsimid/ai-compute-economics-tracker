name: Refresh AI compute dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ai-compute-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - run: pip install -r requirements-deploy.txt
      - name: Refresh source data and build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_USER_AGENT: "AI-Compute-Economics-Tracker/1.0 contact: ${{ github.repository_owner }}@users.noreply.github.com"
        run: python scripts/refresh_and_build.py
      - name: Validate deploy freshness
        run: python scripts/validate_deploy_refresh.py
      - name: Validate dashboard
        run: python -m pytest test_suite/test_time_series_dashboard.py -q
      - name: Commit refreshed artifacts
        run: |
          git config user.name "Angus"
          git config user.email "281128372+angusggsimid@users.noreply.github.com"
          git add public/index.html html_dashboard/ai_compute_economics_monitor.html html_dashboard/v4/time_series_snapshot.json tracker_data/backfills tracker_data/deploy_refresh_status.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh dashboard"
          git push
