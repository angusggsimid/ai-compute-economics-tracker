<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#2c2c34"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 四时钟刻度：表盘四方位 -->
  <g stroke="#6e6e73" stroke-width="2" stroke-linecap="round" opacity=".85">
    <line x1="32" y1="10" x2="32" y2="15"/>
    <line x1="32" y1="49" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="15" y2="32"/>
    <line x1="49" y1="32" x2="54" y2="32"/>
  </g>
  <!-- 趋势线：先抑后扬的拐点叙事 -->
  <polyline points="14,42 24,38 30,41 38,28 50,18"
    fill="none" stroke="#30d158" stroke-width="3.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 拐点标记：Inflection Watch -->
  <circle cx="38" cy="28" r="3.4" fill="#101013" stroke="#30d158" stroke-width="2.4"/>
  <circle cx="14" cy="42" r="2.4" fill="#98989d"/>
  <circle cx="50" cy="18" r="2.4" fill="#30d158"/>
</svg>
